<!doctype html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Thông tin học viên | Yuna
  </title>
  <link href="../css/dung-chung.css" rel="stylesheet"/>
  <link href="../css/hoc-vien.css" rel="stylesheet"/>
 </head>
 <body class="page-student">
  <div id="header">
  </div>
  <main class="page">
   <div class="page-title">
    <span class="eyebrow">
     STUDENT PROFILE
    </span>
    <h1>
     Thông tin học viên
    </h1>
    <p>
     Đăng ký thông tin để trung tâm tư vấn lớp học phù hợp.
    </p>
   </div>
   <form class="form-card two-col" id="studentForm">
    <label>
     Họ và tên
     <input name="name" required=""/>
    </label>
    <label>
     Ngày sinh
     <input name="dob" type="date"/>
    </label>
    <label>
     Email
     <input name="email" required="" type="email"/>
    </label>
    <label>
     Số điện thoại
     <input name="phone" required=""/>
    </label>
    <label>
     Ngôn ngữ quan tâm
     <select name="language">
      <option>
       Tiếng Anh
      </option>
      <option>
       Tiếng Trung
      </option>
      <option>
       Tiếng Nhật
      </option>
      <option>
       Tiếng Hàn
      </option>
     </select>
    </label>
    <label>
     Mục tiêu
     <select name="goal">
      <option>
       Giao tiếp
      </option>
      <option>
       Thi chứng chỉ
      </option>
      <option>
       Học thuật
      </option>
      <option>
       Công việc
      </option>
     </select>
    </label>
    <label class="full-field">
     Ghi chú
     <textarea name="note" rows="4"></textarea>
    </label>
    <button class="btn primary" type="submit">
     Lưu thông tin
    </button>
    <div class="message full-field" id="studentMessage">
    </div>
   </form>
  </main>
  <div id="footer">
  </div>
  <script src="../Js/dung-chung.js">
  </script>
  <script src="../Js/hoc-vien.js">
  </script>
   <script src="../Js/tai-khoan-modal.js"></script>
 </body>
</html>
