<!doctype html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Quản trị | Yuna
  </title>
  <link href="../Người Dùng/css/admin.css" rel="stylesheet"/>
 </head>
 <body>
  <aside class="sidebar">
   <div class="brand">
    YUNA
    <span>
     ADMIN
    </span>
   </div>
   <nav>
    <button class="active" data-section="tong-quan">
     Tổng quan
    </button>
    <button data-section="khoa-hoc">
     Khóa học
    </button>
    <button data-section="lop-hoc">
     Lớp học
    </button>
    <button data-section="giao-vien">
     Giáo viên
    </button>
    <button data-section="hoc-vien">
     Học viên
    </button>
    <button data-section="bai-test">
     Bài test &amp; câu hỏi
    </button>
    <button data-section="thong-ke">
     Thống kê
    </button>
   </nav>
   <button class="logout" id="logoutBtn">
    Đăng xuất
   </button>
  </aside>
  <main class="admin-main">
   <header>
    <div>
     <span class="eyebrow">
      CONTROL CENTER
     </span>
     <h1 id="sectionTitle">
      Tổng quan
     </h1>
    </div>
    <div class="admin-user">
     Quản trị viên
    </div>
   </header>
   <section class="admin-section active" id="tong-quan">
    <div class="stats" id="stats">
    </div>
    <div class="panel">
     <h2>
      Hoạt động gần đây
     </h2>
     <div id="recentList">
     </div>
    </div>
   </section>
   <section class="admin-section" id="khoa-hoc">
    <div class="panel">
     <div class="panel-head">
      <h2>
       Quản lý khóa học
      </h2>
      <button class="btn primary" id="addCourse">
       + Thêm khóa học
      </button>
     </div>
     <div id="courseTable">
     </div>
    </div>
   </section>
   <section class="admin-section" id="lop-hoc">
    <div class="panel">
     <div class="panel-head">
      <h2>
       Quản lý lớp học
      </h2>
      <button class="btn primary" id="addClass">
       + Thêm lớp
      </button>
     </div>
     <div id="classTable">
     </div>
    </div>
   </section>
   <section class="admin-section" id="giao-vien">
    <div class="panel">
     <div class="panel-head">
      <h2>
       Quản lý giáo viên
      </h2>
      <button class="btn primary" id="addTeacher">
       + Tạo tài khoản giáo viên
      </button>
     </div>
     <div id="teacherTable">
     </div>
    </div>
   </section>
   <section class="admin-section" id="hoc-vien">
    <div class="panel">
     <h2>
      Danh sách học viên
     </h2>
     <div id="studentTable">
     </div>
    </div>
   </section>
   <section class="admin-section" id="bai-test">
    <div class="panel">
     <div class="panel-head">
      <h2>
       Bài test &amp; ngân hàng câu hỏi
      </h2>
      <button class="btn primary" id="addQuestion">
       + Thêm câu hỏi
      </button>
     </div>
     <div id="questionTable">
     </div>
    </div>
   </section>
   <section class="admin-section" id="thong-ke">
    <div class="panel">
     <h2>
      Thống kê trung tâm
     </h2>
     <div class="report-grid" id="reportCards">
     </div>
     <div class="bar-chart" id="revenueChart">
     </div>
    </div>
   </section>
  </main>
  <div class="modal" id="adminModal">
  </div>
  <script src="../Người Dùng/Js/admin.js">
  </script>
 </body>
</html>
